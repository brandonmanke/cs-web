<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cs-web</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #070908; }
      body {
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfcab4;
        letter-spacing: 0.04em;
      }
      #app, canvas { width: 100%; height: 100%; display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

      /* Four ticks around a centre dot; the gap grows with real spread. */
      #crosshair {
        --gap: 4px;
        position: absolute; left: 50%; top: 50%;
        width: 0; height: 0;
      }
      #crosshair i {
        position: absolute; background: #86e39a; display: block;
        box-shadow: 0 0 2px #000, 0 0 1px #000;
      }
      #crosshair .h { width: 9px; height: 2px; top: -1px; }
      #crosshair .v { width: 2px; height: 9px; left: -1px; }
      #crosshair .l { right: var(--gap); }
      #crosshair .r { left: var(--gap); }
      #crosshair .u { bottom: var(--gap); }
      #crosshair .d { top: var(--gap); }
      #crosshair .dot {
        width: 2px; height: 2px; left: -1px; top: -1px; background: #86e39a;
      }

      /* Scope: a transparent disc with the rest of the screen blacked out by
         its own box-shadow, plus hairlines. No image, no shader. */
      #scope { position: absolute; inset: 0; overflow: hidden; }
      #scope.hidden { display: none; }
      #scope .ring {
        position: absolute; left: 50%; top: 50%;
        width: min(96vh, 96vw); height: min(96vh, 96vw);
        transform: translate(-50%, -50%);
        border-radius: 50%; display: block;
        border: 2px solid #05070500;
        box-shadow: 0 0 0 100vmax #050705, inset 0 0 60px rgba(0, 0, 0, 0.75);
      }
      #scope .line { position: absolute; background: #0a0d0a; display: block; }
      #scope .line.h { left: 0; right: 0; top: 50%; height: 1px; }
      #scope .line.v { top: 0; bottom: 0; left: 50%; width: 1px; }

      #hitmarker {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        color: #ff5a4a; font-size: 24px; opacity: 0;
        text-shadow: 0 0 3px #000; transition: opacity 60ms linear;
      }
      #hitmarker.show { opacity: 1; }

      #ammo {
        position: absolute; right: 26px; bottom: 20px;
        font-size: 20px; color: #d8d2b4; text-shadow: 0 0 4px #000;
      }
      #ammo .mag { font-size: 30px; color: #f0e8c4; }
      #ammo .dim { color: #9a8f6a; font-size: 18px; }

      #speed {
        position: absolute; left: 26px; bottom: 20px;
        font-size: 18px; color: #8fb496; text-shadow: 0 0 4px #000;
      }
      #health {
        position: absolute; left: 26px; bottom: 46px;
        font-size: 28px; color: #d8d2b4; text-shadow: 0 0 4px #000;
      }
      #health.hurt { color: #e8933c; }
      #health.critical { color: #ff5a4a; }
      #coords {
        position: absolute; left: 26px; bottom: 84px;
        font-size: 11px; color: #6d7a6d; text-shadow: 0 0 3px #000;
      }
      #score {
        position: absolute; right: 26px; top: 18px;
        color: #c3b177; text-align: right; text-shadow: 0 0 4px #000;
        line-height: 1.6;
      }
      #score .ct { color: #7fb2e8; }
      #score .t { color: #e0b268; }

      #killfeed {
        position: absolute; left: 26px; top: 18px;
        font-size: 12px; line-height: 1.8; text-shadow: 0 0 4px #000;
      }
      #killfeed div { opacity: 0.9; }
      #killfeed .self { color: #f0e8c4; }
      #killfeed .weapon { color: #7d8a72; }

      #respawn {
        position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%);
        color: #ff5a4a; font-size: 16px; letter-spacing: 3px; text-align: center;
        text-shadow: 0 0 6px #000;
      }
      #respawn.hidden { display: none; }
      #status {
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        color: #e8933c; font-size: 14px; letter-spacing: 2px; text-align: center;
        text-shadow: 0 0 6px #000;
      }
      #status.hidden { display: none; }
      /* --- menu ------------------------------------------------------- */
      #menu {
        position: fixed; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        background: rgba(6, 8, 7, 0.72);
        backdrop-filter: blur(2px);
      }
      #menu.hidden { display: none; }
      #menu-panel {
        min-width: 340px; padding: 26px 30px 22px;
        background: #12140f;
        border: 1px solid #3b4034;
        box-shadow: 0 0 0 1px #0a0c08, 0 18px 50px rgba(0, 0, 0, 0.65);
      }
      #menu h1 {
        font-size: 22px; font-weight: normal; letter-spacing: 5px;
        color: #e8e2c8; margin-bottom: 2px;
      }
      #menu .sub {
        font-size: 11px; letter-spacing: 3px; color: #7d8a72; margin-bottom: 22px;
      }
      #menu-resume {
        display: block; width: 100%; padding: 11px 0; margin-bottom: 20px;
        font: inherit; font-size: 15px; letter-spacing: 3px;
        color: #0d100b; background: #86e39a; border: 0; cursor: pointer;
      }
      #menu-resume:hover { background: #a2f0b2; }
      #menu-resume:active { background: #6fce85; }

      #menu .row {
        display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
      }
      #menu .row label {
        font-size: 11px; letter-spacing: 2px; color: #9aa38c; min-width: 62px;
      }
      #menu .row input[type="range"] { flex: 1; accent-color: #86e39a; cursor: pointer; }
      #menu .row .value {
        min-width: 54px; text-align: right; font-size: 12px; color: #d8d2b4;
      }

      #menu-maps a {
        color: #9aa38c; text-decoration: none; margin-right: 12px; font-size: 12px;
      }
      #menu-maps a:hover { color: #d8d2b4; }
      #menu-maps a.active { color: #86e39a; }

      #menu .divider {
        font-size: 10px; letter-spacing: 3px; color: #5c6553;
        border-top: 1px solid #2b3026; padding-top: 12px; margin-bottom: 10px;
      }
      #menu dl {
        display: grid; grid-template-columns: auto 1fr; gap: 5px 16px;
        font-size: 11px;
      }
      #menu dt { color: #d8d2b4; white-space: nowrap; }
      #menu dd { color: #808a76; }
      #menu-hint {
        margin-top: 16px; font-size: 10px; letter-spacing: 1px;
        color: #5c6553; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="scope" class="hidden">
        <i class="ring"></i>
        <i class="line h"></i><i class="line v"></i>
      </div>
      <div id="crosshair">
        <i class="dot"></i>
        <i class="h l"></i><i class="h r"></i><i class="v u"></i><i class="v d"></i>
      </div>
      <div id="hitmarker">&times;</div>
      <div id="ammo">--/--</div>
      <div id="health">100</div>
      <div id="speed">0 u/s</div>
      <div id="coords"></div>
      <div id="score"></div>
      <div id="killfeed"></div>
      <div id="respawn" class="hidden">RESPAWNING</div>
      <div id="status">LOADING</div>
    </div>

    <div id="menu" class="hidden">
      <div id="menu-panel">
        <h1>CS-WEB</h1>
        <div class="sub" id="menu-map">&nbsp;</div>

        <button id="menu-resume" type="button">PLAY</button>

        <div class="row">
          <label for="menu-volume">VOLUME</label>
          <input id="menu-volume" type="range" min="0" max="100" value="50" />
          <span id="menu-volume-value" class="value">50%</span>
        </div>

        <div class="row">
          <label for="menu-bots">ENEMIES</label>
          <input id="menu-bots" type="range" min="0" max="9" value="0" />
          <span id="menu-bots-value" class="value">OFF</span>
        </div>

        <div class="row">
          <label for="menu-skill">SKILL</label>
          <input id="menu-skill" type="range" min="0" max="2" value="1" />
          <span id="menu-skill-value" class="value">NORMAL</span>
        </div>

        <div class="row">
          <label>MAP</label>
          <span id="menu-maps"></span>
        </div>

        <div class="divider">CONTROLS</div>
        <dl>
          <dt>WASD</dt><dd>move</dd>
          <dt>SPACE / WHEEL</dt><dd>jump</dd>
          <dt>SHIFT</dt><dd>walk &mdash; silent</dd>
          <dt>CTRL / C</dt><dd>duck</dd>
          <dt>MOUSE1</dt><dd>fire</dd>
          <dt>MOUSE2</dt><dd>scope (AWP)</dd>
          <dt>R</dt><dd>reload</dd>
          <dt>1&ndash;7 / Q</dt><dd>weapons</dd>
        </dl>

        <div id="menu-hint">click anywhere to lock the mouse</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
